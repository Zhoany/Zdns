version: '3'
services:
  myapp:
    image: zzdnsv6:1.0.2
    container_name: zzdnsv6-container
    ports:
      - "53:53/udp"
    volumes:
      - ./cfg.data:/app/cfg.data
      - ./logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped

