server:
  address: ":53530"
  resolve_ipv6: false
  cache_size: 2000
  max_connects: 550
  max_workers: 550
  max_clients: 4500
  enable_logging: true
  log_max_size: 5       # 每个日志文件的最大大小 (MB)
  log_max_backups: 7     # 保留的最大备份数量

upstream_servers:
  - address: "223.6.6.6"
    port: "853"
    protocol: "DoT"
    domain_rules_file: "conf/china-list.txt"
  - address: "223.5.5.5"
    port: "853"
    protocol: "DoT"
    domain_rules_file: "conf/google-list.txt"
  - address: "1.12.12.12"
    port: "853"
    protocol: "DoT"
    domain_rules_file: "conf/apple-cn.txt"
  - address: "10.61.10.100"
    port: "53"
    protocol: "UDP"
    domain_rules_file: "conf/syno-internal.txt"

blocklist_file: "conf/blocklist.txt"

common_upstream:
  address: "https://dns.google/dns-query"
  port: "443"
  protocol: "DoH"